name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      # SwiftStyleLint plugin：warning 升 error、直接 fail build
      SWIFTSTYLELINT_STRICT: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Pin Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: swift build（macOS）
        run: swift build
      - name: swift build（iOS Simulator）
        run: swift build --triple arm64-apple-ios-simulator
      - name: swift build（tvOS Simulator）
        run: swift build --triple arm64-apple-tvos-simulator
